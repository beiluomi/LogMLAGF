name: Integration (ML stack)

on:
  workflow_dispatch:
  schedule:
    # Every Monday 02:00 UTC.
    - cron: "0 2 * * 1"

# Heavy ML integration: installs torch + pyg + transformers and runs the
# integration-marked test suite. Triggered manually or weekly to avoid
# burning GitHub Actions minutes on every PR.

jobs:
  ml-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: |
          pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-ml-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-ml-${{ runner.os }}-

      - name: Sync ML environment (dev + ml)
        run: uv sync --extra dev --extra ml

      - name: Integration tests
        run: uv run pytest tests -m integration --tb=short

      - name: Hello smoke (with PyTorch)
        run: uv run python -m loghetero.cli hello
