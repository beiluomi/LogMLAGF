name: CI (fast)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Fast main-line CI: lint + dev-only tests, no torch/pyg.
# Target wall-time: < 2 minutes.
# Heavy ML integration runs in .github/workflows/integration.yml (manual + weekly).

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: |
          pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-fast-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-fast-${{ runner.os }}-

      - name: Sync dev environment
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Test (excluding integration markers)
        run: uv run pytest tests -m "not integration"

      - name: Hello smoke
        run: uv run python -m loghetero.cli hello
