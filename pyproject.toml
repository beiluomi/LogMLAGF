[project]
name = "loghetero"
version = "0.0.0"
description = "HTGN-LM Co-Pretraining for APT Detection on Provenance Graphs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.11"
authors = [{ name = "LogHetero Authors" }]
keywords = ["apt-detection", "provenance-graph", "graph-neural-network", "language-model", "contrastive-learning"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer>=0.12,<0.13",
    "rich>=13.7",
    "hydra-core>=1.3,<2.0",
    "omegaconf>=2.3,<3.0",
    "numpy>=1.24,<2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    # Note: bumped from torch 2.1 to 2.4+ at Checkpoint 3 because the
    # transformers wheels we want require torch.utils._pytree.register_pytree_node
    # (public API added in torch 2.4); torch 2.1 only has _register_pytree_node.
    # CUDA 12.x wheels work with our 12.8 driver via forward compatibility.
    "torch>=2.4,<3.0",
    "torch-geometric>=2.5,<3.0",
    "lightning>=2.2,<3.0",
    "transformers>=4.40,<6.0",
    "peft>=0.10,<1.0",
    "wandb>=0.16",
    "tensorboard>=2.15",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "tqdm>=4.66",
    "datasets>=2.18",
    "matplotlib>=3.7",  # added Checkpoint 4 for Phase 1.5 histogram plots
]
dev = [
    "ruff>=0.4,<0.5",
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]

[project.scripts]
loghetero = "loghetero.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loghetero"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["data", "outputs", "wandb", "notebooks", "multirun"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "PTH", "RUF"]
ignore = ["E501", "B008", "RUF012", "RUF002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = false
warn_return_any = false
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: tests that require the ML stack (torch / pyg / transformers); run via `make integration-test` or the integration GH Actions workflow",
]
