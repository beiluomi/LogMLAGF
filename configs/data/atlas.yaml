# Phase 1.5 / Phase 1.6 ATLAS data config (shared between window-density
# script, subgraph sampler, and the upcoming Phase 1.6 DataModule).
#
# Hard rule (per Checkpoint 4 launch spec): the values below MUST be
# referenced as Hydra parameters by every consumer; nothing in any .py
# file may hardcode "1 hour" / "50 nodes" / "2 hops". Adjusting the
# eventual decision-6 time-window granularity is a yaml-only edit.

data_dir: data/raw/atlas
manifest: data/atlas_manifest.json

# Time-window bucketing for decision-6 leave-one-attack-out splitting.
# time_window_hours initial is 1.0; the final value is pinned by the
# project owner after reviewing the Checkpoint 4 16+1 histograms.
window:
  time_window_hours: 1.0

# Heterogeneous K-hop subgraph sampling (Phase 1.5 sub-task 1.5/1.6).
# Each "target event" yields one (text_input, hetero_subgraph) tuple.
# Edges in the candidate frontier are scored by combining edge-weight
# (count of same (subject, op, obj) triple in the window) and time
# recency to the target event; the top-`max_nodes` are kept.
subgraph:
  # 128 is the post-Checkpoint-4 default. Sweep space for Phase 7 GPU-budget
  # tuning is [96, 128, 256]: bump to 256 if RTX 4090 VRAM has headroom in
  # the joint pretraining; drop to 96 if Phase 7 OOM. PIDS literature
  # (KAIROS / MAGIC) operates in the 100-500 node-per-subgraph regime; 128
  # is a power-of-two pick that aligns cleanly with batched matmul.
  max_nodes: 128
  khop: 2
  edge_ranking: joint  # one of: weight | time_recency | joint

# Per-event sampling within each (host, time_window) bucket
# (decision 9 -- training/eval unit is per-event subgraph, not per-window).
sample:
  # Cap on the number of target events drawn from each (host, window)
  # bucket. Benign windows are uniformly down-sampled to this cap; malicious
  # windows keep ALL attack events and down-sample only the benign portion
  # to this cap. NumPy global seed (utils/seed.py) governs the choice for
  # reproducibility.
  max_events_per_window: 1000

# Granularity sweep used by build_window_density_histograms.py for the
# Checkpoint 4 decision table. After project-owner review the final
# decision-6 granularity is window.time_window_hours = 1.0; this sweep
# stays around for re-checks if the dataset changes.
granularity_sweep_hours:
  - 0.5
  - 1.0
  - 2.0
  - 4.0
